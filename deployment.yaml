apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college-management
  template:
    metadata:
      labels:
        app: college-management
    spec:
      containers:
        - name: college-management
          image: devansha2003/college-management
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: college-management
spec:
  type: NodePort
  selector:
    app: college-management
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30007