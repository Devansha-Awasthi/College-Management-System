apiVersion: v1
kind: Namespace
metadata:
  name: college-management

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cms-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/cms
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cms-data-pvc
  namespace: college-management
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-management-system
  namespace: college-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cms
  template:
    metadata:
      labels:
        app: cms
    spec:
      containers:
      - name: college-management
        image: devansha2003/college-management   # ✅ FIXED
        ports:
        - containerPort: 3000                   # ✅ FIXED
        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: cms-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: cms-service
  namespace: college-management
spec:
  type: NodePort                             # ✅ FIXED
  selector:
    app: cms
  ports:
  - port: 80
    targetPort: 3000                         # ✅ FIXED
    nodePort: 30007